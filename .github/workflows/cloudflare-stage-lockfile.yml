name: Cloudflare staging — regenerate pnpm lockfile
on:
  push:
    branches:
      - feat/cloudflare-opennext-staging-20261015
    paths:
      - .github/workflows/cloudflare-stage-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.repository == 'bietalreef/bietalreef-platform-cloudflare' && github.ref == 'refs/heads/feat/cloudflare-opennext-staging-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact migration branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.28.0
      - name: Resolve lockfile without running package scripts
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          pnpm install --lockfile-only --frozen-lockfile --ignore-scripts
      - name: Commit only resolved dependency lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m "chore(lockfile): sync supported Next/OpenNext staging dependencies"
          git push origin HEAD:feat/cloudflare-opennext-staging-20261015
