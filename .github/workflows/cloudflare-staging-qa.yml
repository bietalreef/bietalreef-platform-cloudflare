name: Cloudflare staging — local SEO contract tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'components/home/ProjectDiscovery.js'
      - 'components/home/ProjectDiscovery.module.css'
      - 'components/ConsentAwareGoogleTag.js'
      - 'next.config.js'
      - 'scripts/pagespeed-cloudflare-gate.test.cjs'
      - '.github/workflows/cloudflare-staging-qa.yml'
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'bietalreef/bietalreef-platform-cloudflare'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned package manager
        run: npm install --global pnpm@10.28.0
      - name: Install frozen dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Structure audit
        run: pnpm audit:site
      - name: Local services SEO tests
        run: pnpm test:local-services
      - name: Local SEO growth tests
        run: pnpm test:local-growth
      - name: Cloudflare production-scope PageSpeed and privacy contract
        run: node --test scripts/pagespeed-cloudflare-gate.test.cjs
