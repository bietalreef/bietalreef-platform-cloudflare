name: Makkah bilingual Pages Router review gate
on:
  push:
    branches:
      - work/makkah-publish-readiness-20261027
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Makkah data and asset contract
        run: node --test scripts/makkah-publication-contract.test.cjs
      - name: Next.js 15 Pages Router build
        run: pnpm build
