name: Published provider presence release gate
on:
  push:
    branches:
      - release/provider-presence-makkah-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  next-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Next.js 15 Pages Router build
        run: pnpm build
