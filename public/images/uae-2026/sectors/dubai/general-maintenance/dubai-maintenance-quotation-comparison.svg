<title id="title">مقارنة نطاق عروض الصيانة / Maintenance quotation comparison worksheet</title>
<desc id="desc">Three blank offer columns. Seven row keys: inspection fees, diagnosis and assumptions, materials, labour, exclusions, tests, warranty. Blank fields are placeholders, not company ratings or prices. Detailed three-offer comparison must be rendered as an accessible HTML table.</desc>
